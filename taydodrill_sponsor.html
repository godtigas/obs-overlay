<!DOCTYPE html>
<!--
  ============================================================
  TAYDODRILL — SPONSOR (bloco à parte, Bettilt)
  ============================================================
  Bloco independente da overlay principal — é a sua própria
  Browser Source no OBS, tal como o chat e o "starting soon".

  COMO USAR NO OBS:
  1. Adiciona uma "Browser Source" (Fonte de Navegador).
  2. Marca "Local file" e escolhe este ficheiro .html
     (ou hospeda-o e usa o URL, tal como os outros).
  3. Largura: 1920  Altura: 1080  (mesmo canvas dos outros ficheiros,
     para o cartão ficar alinhado com a overlay principal).
  4. Deixa "Shutdown source when not visible" DESLIGADO.
  5. O cartão já vem posicionado por baixo da barra do topo,
     encostado ao lado esquerdo do chat — sem tapar a câmara
     nem a captura de ecrã. Se quiseres mudar de sítio ou
     tamanho, arrasta/redimensiona a fonte no OBS como qualquer
     outra.

  Este ficheiro precisa de duas imagens ao lado dele no mesmo
  sítio (mesma pasta/repositório):
    - bettilt_logo_small.png
    - bettilt_promo_small.jpg
  ============================================================
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>TaydoDrill Sponsor</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
  }

  /* ---------- SPONSOR (bettilt) ---------- */
  #sponsor-card {
    position: absolute;
    top: 96px;
    right: 466px;
    width: 230px;
    background: linear-gradient(160deg, rgba(10,32,60,.92), rgba(8,26,51,.92));
    border: 1px solid rgba(100,190,255,.28);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 24px rgba(45,140,220,.12);
  }
  #sponsor-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #6fb3d9;
    text-transform: uppercase;
    margin: 0 0 8px 2px;
  }
  #sponsor-logo-wrap {
    background: #ffffff;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sponsor-logo-wrap img { width: 100%; height: auto; display: block; }
  #sponsor-promo {
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  #sponsor-promo img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <div id="stage">
    <!-- SPONSOR -->
    <div id="sponsor-card">
      <div id="sponsor-label">Patrocinado por</div>
      <div id="sponsor-logo-wrap">
        <img src="bettilt_logo_small.png" alt="Bettilt">
      </div>
      <div id="sponsor-promo">
        <img src="bettilt_promo_small.jpg" alt="Bettilt - Thor vs Loki - 50 FS - codigo BARROTEFS">
      </div>
    </div>
  </div>
</body>
</html>
