<!DOCTYPE html>
<!--
  ============================================================
  TAYDODRILL — CHAT (canto superior direito, até ao meio do ecrã)
  ============================================================
  Overlay simples: canvas fixo 1920x1080, com o chat encostado ao
  lado direito, desde o topo até sensivelmente a meio do ecrã.
  O resto da página fica transparente.

  COMO USAR NO OBS:
  1. Adiciona uma Browser Source → Local file → escolhe este ficheiro.
  2. Largura: 1920  Altura: 1080 (igual ao teu canvas de stream).
  3. Não precisas de mover nem redimensionar nada — o chat já fica
     posicionado no sítio certo automaticamente.

  Para ajustar o tamanho/posição exatos, edita os valores em
  #chatbox no <style> (top, right, width, height).

  CANAL DA TWITCH: edita CONFIG.twitchChannel e CONFIG.chatParents
  no <script> lá em baixo.
  ============================================================
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>TaydoDrill Chat (topo direita)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }
  * { box-sizing: border-box; }

  #chatbox {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 430px;
    height: 520px; /* até sensivelmente a meio do ecrã (1080/2 - margens) */
    background: linear-gradient(120deg, #081a33, #123a63, #0d6e8f, #0a2c52, #081a33);
    background-size: 300% 300%;
    animation: aurora-move 14s ease-in-out infinite;
    border: 1px solid #1f5c8f;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 24px rgba(45,140,220,.08);
  }
  @keyframes aurora-move {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #chatbox iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>

<div id="chatbox">
  <iframe id="twitch-chat" src="" scrolling="no"></iframe>
</div>

<script>
const CONFIG = {
  twitchChannel: "taydodrill",
  chatParents: ["twitch.tv", "localhost", "obs"],

  // deixa em "" para não usar configuração remota
  remoteConfigUrl: "",
  remoteRefreshMs: 5 * 60 * 1000,
};

let lastChatKey = null;
function applyTwitchChat(){
  const key = CONFIG.twitchChannel + '|' + CONFIG.chatParents.join(',');
  if (key === lastChatKey) return;
  lastChatKey = key;
  const parents = CONFIG.chatParents.map(p => "parent=" + encodeURIComponent(p)).join("&");
  document.getElementById('twitch-chat').src =
    "https://www.twitch.tv/embed/" + encodeURIComponent(CONFIG.twitchChannel) + "/chat?" + parents + "&darkpopout";
}

async function loadRemoteConfig(){
  if (!CONFIG.remoteConfigUrl) return false;
  try {
    const bust = CONFIG.remoteConfigUrl.includes('?') ? '&' : '?';
    const res = await fetch(CONFIG.remoteConfigUrl + bust + 't=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    Object.assign(CONFIG, remote);
    return true;
  } catch (e) {
    console.error('remote config error', e);
    return false;
  }
}

async function init(){
  await loadRemoteConfig();
  applyTwitchChat();
  if (CONFIG.remoteConfigUrl) {
    setInterval(async () => {
      const changed = await loadRemoteConfig();
      if (changed) applyTwitchChat();
    }, CONFIG.remoteRefreshMs);
  }
}
init();
</script>

</body>
</html>
