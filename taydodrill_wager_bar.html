<!DOCTYPE html>
<!--
  ============================================================
  TAYDODRILL — BARRA DE WAGER (manual)
  ============================================================
  Bloco independente — é a sua própria Browser Source no OBS,
  tal como o chat e o sponsor.

  COMO USAR NO OBS:
  1. Adiciona uma "Browser Source" (Fonte de Navegador).
  2. Marca "Local file" e escolhe este ficheiro .html
     (ou hospeda-o e usa o URL, tal como os outros).
  3. Largura: 340   Altura: 92   (a resolução é só do tamanho
     do cartão — nada de 1920x1080 aqui).
  4. Deixa "Shutdown source when not visible" DESLIGADO — isto
     é importante, porque é isso que faz o valor manter-se
     guardado entre streams (fica guardado no browser da própria
     fonte).

  COMO MUDAR A PERCENTAGEM MANUALMENTE (enquanto estás em direto):
  - No OBS, clica com o botão direito na fonte → "Interact...".
    Isso abre uma janela onde podes clicar nela como se fosse
    um browser normal.
  - Clica em qualquer ponto da barra para saltar direto para
    essa percentagem.
  - Clica no número da percentagem para escreveres um valor
    exato e depois prime Enter. Enquanto escreves não aparece
    nada no ecrã — o número só muda quando confirmas com Enter.
  - Com a fonte focada no "Interact", as setas ↑ ↓ do teclado
    ajustam de 0.1 em 0.1 (mais fino/devagar). SHIFT + seta
    ajusta de 1 ponto percentual inteiro de cada vez.
  - O valor fica guardado automaticamente (localStorage desta
    fonte) — não precisas de repetir isto todas as streams.

  PARA MUDAR O TEXTO/COR INICIAL:
  Vai à secção "CONFIG" no <script> lá em baixo.
  ============================================================
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>TaydoDrill Wager Bar</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #wager-card {
    width: 340px;
    padding: 16px 18px;
    background: rgba(30, 34, 42, 0.85);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 24px rgba(45,140,220,.10);
    color: #fff;
  }

  #wager-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #wager-label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #ffd447;
    text-transform: uppercase;
  }

  #wager-value {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    cursor: text;
    padding: 0 4px;
    border-radius: 6px;
    min-width: 46px;
    text-align: right;
  }
  #wager-value:hover { background: rgba(255,255,255,.08); }

  /* campo de edição invisível — fica fora do ecrã, nunca aparece em stream;
     só serve para capturar o que escreves. O número só muda no cartão
     quando confirmas com Enter. */
  #wager-hidden-input {
    position: fixed;
    top: 0;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: none;
    padding: 0;
    background: transparent;
  }

  #wager-track-wrap {
    display: flex;
    align-items: center;
  }

  #wager-track {
    position: relative;
    flex: 1;
    height: 16px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.10);
  }

  #wager-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, #ffd447, #34d17c);
    border-radius: 999px;
    transition: width .18s ease;
  }
</style>
</head>
<body>

<div id="wager-card">
  <div id="wager-top">
    <div id="wager-label">Wager</div>
    <div id="wager-value"><span id="wager-value-text">0%</span></div>
  </div>
  <div id="wager-track-wrap">
    <div id="wager-track">
      <div id="wager-fill"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — edita aqui os teus dados
   ============================================================ */
const CONFIG = {
  label: "Wager",
  initialPercent: 0,      // só é usado se ainda não houver valor guardado
  step: 0.1,              // incremento normal das setas (mais fino/devagar)
  stepShift: 1,           // incremento com SHIFT premido (ponto percentual inteiro)
  storageKey: "taydodrill_wager_percent",
};

const track = document.getElementById('wager-track');
const fill = document.getElementById('wager-fill');
const valueBox = document.getElementById('wager-value');
const valueText = document.getElementById('wager-value-text');
document.getElementById('wager-label').textContent = CONFIG.label;

let percent = CONFIG.initialPercent;
try {
  const saved = localStorage.getItem(CONFIG.storageKey);
  if (saved !== null && saved !== "" && !isNaN(parseFloat(saved))) {
    percent = parseFloat(saved);
  }
} catch (e) {}

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function render(){
  percent = clamp(percent);
  fill.style.width = percent + '%';
  valueText.textContent = Math.round(percent * 10) / 10 + '%';
  try { localStorage.setItem(CONFIG.storageKey, String(percent)); } catch (e) {}
}

function setPercent(v){
  percent = clamp(Math.round(v * 10) / 10);
  render();
}

track.addEventListener('click', (e) => {
  const rect = track.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  setPercent(ratio * 100);
});

// clicar no número para escrever um valor exato — o campo onde escreves
// fica completamente invisível (fora do ecrã); o cartão só muda quando
// confirmas com Enter, para nunca se ver em stream que estás a editar.
let editing = false;

valueBox.addEventListener('click', () => {
  if (editing) return;
  editing = true;
  const current = Math.round(percent * 10) / 10;

  const input = document.createElement('input');
  input.id = 'wager-hidden-input';
  input.type = 'number';
  input.min = '0';
  input.max = '100';
  input.step = '0.1';
  input.value = current;
  document.body.appendChild(input);
  input.focus();
  input.select();

  function cleanup(){
    input.remove();
    editing = false;
  }
  function commit(){
    const v = parseFloat(input.value);
    if (!isNaN(v)) setPercent(v);
    cleanup();
  }
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') cleanup();
  });
  input.addEventListener('blur', commit);
});

// setas do teclado também ajustam (útil se a fonte estiver focada no "Interact")
// o "lastKeyTime" impede que o auto-repeat do teclado (quando mantens a
// seta premida) dispare demasiado depressa — só deixa passar um passo de
// cada vez, no máximo a cada KEY_INTERVAL_MS.
const KEY_INTERVAL_MS = 110;
let lastKeyTime = 0;
document.addEventListener('keydown', (e) => {
  if (editing) return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const now = performance.now();
  if (now - lastKeyTime < KEY_INTERVAL_MS) return;
  lastKeyTime = now;
  const amount = e.shiftKey ? CONFIG.stepShift : CONFIG.step;
  setPercent(percent + (e.key === 'ArrowUp' ? amount : -amount));
});

render();
</script>

</body>
</html>
